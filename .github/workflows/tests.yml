name: Python tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
 test:
   runs-on: ubuntu-latest

   steps:
    - name: Check out repository
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install test dependencies
      run: python -m pip install -r requirements-dev.txt

    - name: Run tests
      run: python -m pytest -v

    - name: Build Docker image
      run: docker build -t service-health-monitor:ci .

    - name: Test container against a local server
      shell: bash
      run: |
        mkdir -p /tmp/healthcheck-site
        echo "OK" > /tmp/healthcheck-site/index.html

        python -m http.server 8765 \
          --bind 127.0.0.1 \
          --directory /tmp/healthcheck-site \
          > /tmp/healthcheck-server.log 2>&1 &

        curl -f --retry 5 --retry-connrefused --retry-delay 1 http://127.0.0.1:8765

        docker run --rm -e TARGET_URL=http://127.0.0.1:8765/ \
        --network host service-health-monitor:ci

        actual_code=0

        docker run --rm -e TARGET_URL=http://127.0.0.1:8765/missing-page \
        --network host service-health-monitor:ci || actual_code=$?

        test "$actual_code" -eq 1
